<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>章士钊 · 一个在每个阵营都有座位的人</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 铅字印刷的轻微洇墨 -->
    <filter id="ink" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
</svg>
<div id="stage">
  <div id="scenes"></div>
  <div id="hud"></div>
  <div id="subs"><span id="subtext"></span></div>
</div>
<script src="timings.js"></script>
<script src="scriptdata.js"></script>
<script src="mapdata.js"></script>
<script src="engine.js"></script>
<script src="components.js"></script>
<script src="scenes_a.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
<script>E.boot();</script>
</body>
</html>
