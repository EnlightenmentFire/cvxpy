<script>
  ENGINE.init();
  const q = new URLSearchParams(location.search);
  if (q.has('t')) ENGINE.render(parseFloat(q.get('t')));
  if (q.has('play')) { const t0 = performance.now(), off = parseFloat(q.get('play')) || 0;
