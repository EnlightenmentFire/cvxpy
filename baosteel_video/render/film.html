<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--ink:#0a0f15;--bp:#0e2136;--bp2:#132c47;--line:#8fbfe3;--paper:#e7dfca;--pink:#1e1a15;--steel:#a3adb6;--hot:#ff7a1a;--hot2:#ffc24a;--seal:#c23b2a;--dim:#7d8791}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink);color:#f1ede4;font-family:"Noto Sans CJK SC";-webkit-font-smoothing:antialiased}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none}
.abs{position:absolute}.c{text-align:center}
.serif{font-family:"Noto Serif CJK SC";font-weight:900}
.sans{font-family:"Noto Sans CJK SC";font-weight:900}
.num{font-family:"Barlow Condensed";font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono","Noto Sans CJK SC";font-weight:500}
.bp{background:radial-gradient(120% 80% at 50% 40%,#16314e 0%,#0e2136 55%,#091626 100%)}
.bpgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(143,191,227,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(143,191,227,.07) 1px,transparent 1px),linear-gradient(rgba(143,191,227,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(143,191,227,.11) 1px,transparent 1px);background-size:36px 36px,36px 36px,180px 180px,180px 180px}
.paper{background:radial-gradient(130% 90% at 50% 35%,#efe8d6 0%,#e4dcc6 60%,#cfc5aa 100%);color:var(--pink)}
.dark{background:radial-gradient(120% 80% at 50% 38%,#18212b 0%,#0c1219 60%,#06090d 100%)}
svg{position:absolute;overflow:visible}
.ln{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tag{position:absolute;display:flex;align-items:stretch;font-size:34px;line-height:1.2}
.tag .n{background:#f1ede4;color:#10161d;font-family:"Noto Serif CJK SC";font-weight:900;padding:10px 18px;font-size:40px;white-space:nowrap}
.tag .r{background:rgba(10,15,21,.82);color:#d9dee3;padding:10px 18px;border:1px solid rgba(241,237,228,.35);border-left:none;font-weight:500;font-size:28px;display:flex;align-items:center;white-space:nowrap}
.paper .tag .n{background:#1e1a15;color:#efe8d6}.paper .tag .r{background:rgba(231,223,202,.9);color:#1e1a15;border-color:rgba(30,26,21,.5)}
.stamp{position:absolute;border:6px solid var(--seal);color:var(--seal);font-family:"Noto Serif CJK SC";font-weight:900;padding:8px 26px;letter-spacing:.12em;mix-blend-mode:multiply}
.def{position:absolute;border-left:6px solid var(--hot);padding:6px 0 6px 22px;font-size:34px;line-height:1.45;color:#dfe4e8;font-weight:500}
.def b{color:#fff;font-weight:900;font-size:40px}
.paper .def{color:#3a342b}.paper .def b{color:#1e1a15}
.q{position:absolute;font-family:"Noto Serif CJK SC";font-weight:900;line-height:1.38}
#hud{position:absolute;inset:0;pointer-events:none}
#hdr{position:absolute;left:64px;right:64px;top:232px;height:44px;display:flex;justify-content:space-between;align-items:center;font-size:25px;letter-spacing:.14em;color:rgba(241,237,228,.72);border-bottom:1px solid rgba(241,237,228,.28);padding-bottom:10px;font-weight:500}
#hdr.pp{color:rgba(30,26,21,.75);border-color:rgba(30,26,21,.35)}
#src{position:absolute;left:54px;max-width:860px;padding:3px 10px;background:rgba(6,9,13,.5);top:1298px;font-size:23px;line-height:1.3;color:rgba(241,237,228,.62);font-weight:400;letter-spacing:.02em}
#src.pp{color:rgba(30,26,21,.68);background:none}
#sub{position:absolute;left:0;width:1080px;top:1372px;text-align:center}
#sub span{display:inline-block;font-size:47px;font-weight:700;line-height:1.3;color:#fff;padding:8px 22px;background:rgba(6,9,13,.62);border-radius:4px;letter-spacing:.02em;max-width:860px;text-wrap:balance}
#vig{position:absolute;inset:0;background:radial-gradient(75% 62% at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
#safe{position:absolute;inset:0;display:none}
#safe div{position:absolute;background:rgba(255,0,80,.18);border:1px dashed rgba(255,0,80,.8)}
</style></head><body>
<div id="stage"><div id="scenes"></div><div id="vig"></div>
<div id="hud"><div id="hdr"><span id="hl">改革开放 · 01</span><span id="hr"></span></div><div id="src"></div><div id="sub"></div></div>
<div id="safe"><div style="left:0;top:0;width:1080px;height:220px"></div><div style="left:0;top:1500px;width:1080px;height:420px"></div><div style="left:940px;top:1040px;width:140px;height:460px"></div></div>
</div>
<script src="timeline.js"></script><script src="mapdata.js"></script>
<script src="core.js"></script><script src="gfx.js"></script>
<script src="s1.js"></script><script src="s2.js"></script><script src="s3.js"></script>
<script>Film.init();</script>
</body></html>
